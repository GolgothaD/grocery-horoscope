<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grocery Horoscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f3e6c4;font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;background:radial-gradient(ellipse at top,#3b1c5a,#120822 70%);}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 10%,#fff9,transparent),radial-gradient(2px 2px at 40% 80%,#ffd77a88,transparent),radial-gradient(1px 1px at 85% 60%,#fff8,transparent),radial-gradient(1px 1px at 10% 90%,#fff8,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.4}}
h1,h2{font-family:"Cinzel Decorative",serif;color:#ffd77a;text-align:center;margin:.3em 0}h1{font-size:1.7rem;margin-top:24px;text-shadow:0 0 18px #ffb34788}
.sub{text-align:center;font-style:italic;opacity:.8;margin:0 0 10px}main{max-width:480px;margin:0 auto;padding:0 16px 60px}
.box{border:1px solid #ffd77a55;border-radius:16px;padding:16px;background:#1d0f33cc;margin:14px 0;box-shadow:inset 0 0 30px #0006}
textarea{width:100%;min-height:110px;background:#0d0619;border:1px solid #ffd77a44;color:#f3e6c4;border-radius:12px;padding:10px;font:inherit}
button{font-family:"Cinzel Decorative",serif;font-size:.95rem;border:1px solid #ffd77a;color:#1a0b2e;background:linear-gradient(#ffe7a3,#e0a93d);padding:12px 16px;border-radius:999px;cursor:pointer;width:100%;margin-top:8px}
button.ghost{background:transparent;color:#ffd77a}
.cards{display:flex;gap:8px;justify-content:center;perspective:900px;margin:16px 0}
.tc{width:31%;aspect-ratio:2/3.3;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
.tc.flip{transform:rotateY(180deg)}.tc>div{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;border:2px solid #ffd77a}
.back{background:repeating-linear-gradient(45deg,#4a2177 0 8px,#3a1660 8px 16px);font-size:2rem}
.front{transform:rotateY(180deg);background:linear-gradient(#fff4d6,#e9cf94);color:#2a1440}.front .e{font-size:2.2rem}.front small{font-family:"Cinzel Decorative";font-size:.62rem;line-height:1.2}
.reading p{line-height:1.5;margin:.6em 0}.reading p:first-letter{font-size:1.5em;color:#ffd77a}.fade{animation:fd 1.2s both}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.lucky{text-align:center;font-size:1.1rem}.lucky b{font-size:1.5rem;color:#ffd77a;display:block}.hide{display:none}img.share{width:100%;border-radius:12px;margin-top:10px}
</style></head><body><main>
<h1>✦ Grocery Horoscope ✦</h1><p class="sub">Your cart knows things. Let it speak.</p>
<div class="box lucky" id="lucky"></div>
<div class="box"><label>Enter thy cart, one item per line (or commas):</label><textarea id="cart" placeholder="bananas&#10;hot sauce&#10;frozen pizza&#10;eggs"></textarea>
<button id="read">🔮 Read My Fate</button><button class="ghost" id="ex">Use a sample cart</button></div>
<section id="res" class="hide"><div class="cards" id="cards"></div><div class="box reading" id="reading"></div>
<button id="share">📜 Share as Image</button><img class="share hide" id="img" alt="horoscope image"><a id="dl" class="hide" download="grocery-horoscope.png"></a></section>
</main><canvas id="cv" width="1080" height="1350" style="display:none"></canvas><script src="app.js"></script></body></html>
